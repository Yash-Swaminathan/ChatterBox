name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: Server tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chatterbox
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Throwaway values for the service containers above; nothing here is a real secret
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/chatterbox
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret-not-used-anywhere-else
      JWT_REFRESH_SECRET: ci-refresh-secret-not-used-anywhere-else

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      # The same migrations the production image applies on start, against an empty database
      - name: Run migrations
        run: npm run migrate

      - name: Run tests
        run: |
          npm test -- --json --outputFile=/tmp/r.json > /dev/null 2>&1 || true
          node -e "const r=require('/tmp/r.json');for(const s of r.testResults){if(s.status!=='passed'){console.log('DEBUGSUITE',s.name,JSON.stringify(s.message));for(const a of s.assertionResults){if(a.status==='failed')console.log('DEBUGTEST',JSON.stringify(a,null,1))}}}"
          exit 1

  client:
    name: Client build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci

      - run: npm run build
